spring:
  application:
    name: picker-api

  # --- Database ---
  datasource:
    url: jdbc:postgresql://localhost:5433/stockpicker
    username: stockpicker
    password: stockpicker
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

logging:
  level:
    com.stockpicker: DEBUG
